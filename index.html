<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Maarif Fuar Standı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
/* Tek görünüm: tam ekran 3D sahne, üstte künye, altta cam panel. Tek tema (koyu panel, fuar salonu grisi zemin). */
:root {
  --salon: #a7a59f;          /* fuar salonu zemini, sahne arka planı */
  --panel: rgba(18, 26, 28, 0.82);
  --panel-cizgi: rgba(255, 255, 255, 0.14);
  --yazi: #f2f1ec;
  --soluk: #b8c4c5;
  --turkuaz: #00adba;        /* Maarif turkuazı */
  --turkuaz-koyu: #007f89;
  --baslik: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --metin: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--salon); color: var(--yazi); font-family: var(--metin); overflow: hidden; -webkit-user-select: none; user-select: none; }
#sahne { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.kunye {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none;
}
.kart { background: var(--panel); border: 1px solid var(--panel-cizgi); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.baslik { padding: 10px 14px; pointer-events: auto; max-width: min(420px, 100%); min-width: 0; }
.baslik h1 { font: 600 17px/1.2 var(--baslik); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.baslik h1 span { color: var(--turkuaz); }
.baslik p { margin: 4px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--soluk); }
kbd { font: 500 11px/1 var(--metin); border: 1px solid var(--panel-cizgi); border-radius: 4px; padding: 2px 5px; color: var(--yazi); }

.alt {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.sira { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px; pointer-events: auto; max-width: 100%; }
button {
  font: 500 13px/1 var(--metin); color: var(--yazi); background: transparent; border: 1px solid transparent;
  border-radius: 8px; padding: 9px 12px; cursor: pointer; touch-action: manipulation;
}
button:hover { background: rgba(255, 255, 255, 0.08); }
button:focus-visible { outline: 2px solid var(--turkuaz); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--turkuaz-koyu); border-color: var(--turkuaz); }
.ayrac { width: 1px; align-self: stretch; background: var(--panel-cizgi); margin: 2px 2px; }

/* sanal joystick (dokunmatik + yürüme modu) */
#joy {
  position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
  width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--panel-cizgi); background: var(--panel); touch-action: none;
}
#joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--turkuaz); opacity: 0.9; }

#durum { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
#durum .kart { padding: 14px 18px; min-width: 220px; text-align: center; }
#durum .bar { height: 4px; border-radius: 2px; background: var(--panel-cizgi); margin-top: 10px; overflow: hidden; }
#durum .bar b { display: block; height: 100%; width: 0; background: var(--turkuaz); transition: width 0.2s; }
@media (prefers-reduced-motion: reduce) { #durum .bar b { transition: none; } }
@media (max-width: 520px) {
  .baslik p .masa { display: none; }
  button { padding: 9px 10px; font-size: 12.5px; }
}
@media (hover: hover) and (pointer: fine) { .baslik p .dokun { display: none; } }
@media not ((hover: hover) and (pointer: fine)) { .baslik p .masa { display: none; } }
</style>

<canvas id="sahne" tabindex="0" aria-label="Maarif fuar standının 3D görünümü"></canvas>

<div class="kunye">
  <div class="kart baslik">
    <h1>Türkiye <span>Maarif</span> Vakfı · Fuar Standı</h1>
    <p id="ipucu">
      <span class="masa" data-mod="bak">Sürükle: döndür · Tekerlek: yakınlaş · Sağ tık: kaydır</span>
      <span class="dokun" data-mod="bak">Tek parmak: döndür · İki parmak: yakınlaş</span>
      <span class="masa" data-mod="gez" hidden><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> yürü · Sürükle: etrafa bak · <kbd>Shift</kbd> hızlı</span>
      <span class="dokun" data-mod="gez" hidden>Sol daire: yürü · Ekranı sürükle: etrafa bak</span>
    </p>
  </div>
</div>

<div class="alt">
  <div class="kart sira" role="toolbar" aria-label="Görünüm">
    <button id="mod-bak" aria-pressed="true">Dışarıdan bak</button>
    <button id="mod-gez" aria-pressed="false">İçinde gez</button>
    <span class="ayrac" aria-hidden="true"></span>
    <button data-nokta="genel">Genel</button>
    <button data-nokta="sinif">Sınıf</button>
    <button data-nokta="vip">VIP</button>
    <button data-nokta="karsilama">Karşılama</button>
    <button data-nokta="logo">Logo</button>
  </div>
</div>

<div id="joy" hidden aria-hidden="true"><i></i></div>

<div id="durum"><div class="kart"><div id="durum-yazi">Stand yükleniyor…</div><div class="bar"><b id="durum-bar"></b></div></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const dokunmatik = matchMedia("(hover: none), (pointer: coarse)").matches;
const canvas = document.getElementById("sahne");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !dokunmatik, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, dokunmatik ? 1.5 : 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa7a59f);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;

// Blender (x, y, z) -> three (x, z, -y). Stand 6 x 6 m, ön cephe +z yönünde.
const B = (x, y, z) => new THREE.Vector3(x, z, -y);

// soldan gün ışığı (Blender'daki gibi)
const gunes = new THREE.DirectionalLight(0xfff0dc, 2.2);
gunes.position.copy(B(-5, 2, 8)); gunes.target.position.copy(B(3, 3, 0));
gunes.castShadow = true;
gunes.shadow.mapSize.set(dokunmatik ? 1024 : 2048, dokunmatik ? 1024 : 2048);
Object.assign(gunes.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
gunes.shadow.bias = -0.0005; gunes.shadow.normalBias = 0.02;
scene.add(gunes, gunes.target);
// sınıf ve alanların üstündeki yuvarlak spotların yerine yumuşak dolgu
for (const [x, y] of [[2.2, 3.1], [3.8, 3.1], [2.2, 1.7], [3.8, 1.7], [1.2, 5.0], [3.5, 5.25], [5.25, 5.05]]) {
  const p = new THREE.PointLight(0xffe9cf, 4.5, 6, 2); p.position.copy(B(x, y, 3.0)); scene.add(p);
}

const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 200);
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI * 0.495; orbit.minDistance = 1.5; orbit.maxDistance = 25;

// hazır bakış noktaları: [göz, hedef] (Blender koordinatı)
const NOKTA = {
  genel: [B(-3.5, -6.5, 6.5), B(3, 3, 1.5)],
  sinif: [B(3.0, 0.4, 1.6), B(3.0, 3.9, 1.5)],
  vip: [B(2.2, 4.35, 1.6), B(1.2, 5.9, 1.55)],
  karsilama: [B(5.75, 2.7, 1.6), B(5.2, 4.9, 1.1)],
  logo: [B(3.0, -5.5, 3.2), B(3.0, -0.4, 4.8)],
};

// --- yürüme modu: sürükleyerek bak, tuş / joystick ile yürü ---
let mod = "bak", yaw = 0, pitch = 0;
const tus = new Set(); const joy = { x: 0, y: 0 };
camera.rotation.order = "YXZ";
function bakisAyarla(goz, hedef) {
  camera.position.copy(goz);
  const d = hedef.clone().sub(goz).normalize();
  yaw = Math.atan2(-d.x, -d.z); pitch = Math.asin(THREE.MathUtils.clamp(d.y, -1, 1));
}
function git(ad) {
  let [goz, hedef] = NOKTA[ad];
  // dikey ekranda genel/logo görünümünde biraz geri çekil ki stand sığsın
  if (camera.aspect < 1 && (ad === "genel" || ad === "logo")) goz = hedef.clone().add(goz.clone().sub(hedef).multiplyScalar(1.2));
  if (mod === "bak") { camera.position.copy(goz); orbit.target.copy(hedef); orbit.update(); }
  else { bakisAyarla(new THREE.Vector3(goz.x, 1.6, goz.z), new THREE.Vector3(hedef.x, 1.5, hedef.z)); }
}
function modSec(yeni) {
  mod = yeni;
  orbit.enabled = mod === "bak";
  document.getElementById("mod-bak").setAttribute("aria-pressed", mod === "bak");
  document.getElementById("mod-gez").setAttribute("aria-pressed", mod === "gez");
  for (const el of document.querySelectorAll("[data-mod]")) el.hidden = el.dataset.mod !== mod;
  document.getElementById("joy").hidden = !(mod === "gez" && dokunmatik);
  if (mod === "gez") git("sinif"); else git("genel");
}
document.getElementById("mod-bak").onclick = () => modSec("bak");
document.getElementById("mod-gez").onclick = () => modSec("gez");
for (const b of document.querySelectorAll("[data-nokta]")) b.onclick = () => git(b.dataset.nokta);

let surukle = null;
canvas.addEventListener("pointerdown", (e) => { if (mod !== "gez") return; surukle = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!surukle || e.pointerId !== surukle.id) return;
  const k = dokunmatik ? 0.005 : 0.0035;
  yaw -= (e.clientX - surukle.x) * k; pitch -= (e.clientY - surukle.y) * k;
  pitch = THREE.MathUtils.clamp(pitch, -1.3, 1.3);
  surukle.x = e.clientX; surukle.y = e.clientY;
});
const birak = (e) => { if (surukle && e.pointerId === surukle.id) surukle = null; };
canvas.addEventListener("pointerup", birak); canvas.addEventListener("pointercancel", birak);
addEventListener("keydown", (e) => { if (!e.target.closest("button")) tus.add(e.code); });
addEventListener("keyup", (e) => tus.delete(e.code));
addEventListener("blur", () => tus.clear());

const joyEl = document.getElementById("joy"), topuz = joyEl.querySelector("i");
let joyId = null;
function joyHareket(e) {
  const r = joyEl.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  const l = Math.hypot(dx, dy); if (l > R) { dx *= R / l; dy *= R / l; }
  joy.x = dx / R; joy.y = dy / R; topuz.style.transform = `translate(${dx}px, ${dy}px)`;
}
joyEl.addEventListener("pointerdown", (e) => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyHareket(e); });
joyEl.addEventListener("pointermove", (e) => { if (e.pointerId === joyId) joyHareket(e); });
const joyBirak = (e) => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = 0; topuz.style.transform = ""; };
joyEl.addEventListener("pointerup", joyBirak); joyEl.addEventListener("pointercancel", joyBirak);

function yuru(dt) {
  let ileri = (tus.has("KeyW") || tus.has("ArrowUp") ? 1 : 0) - (tus.has("KeyS") || tus.has("ArrowDown") ? 1 : 0) - joy.y;
  let yan = (tus.has("KeyD") || tus.has("ArrowRight") ? 1 : 0) - (tus.has("KeyA") || tus.has("ArrowLeft") ? 1 : 0) + joy.x;
  const hiz = (tus.has("ShiftLeft") || tus.has("ShiftRight") ? 3.2 : 1.5) * dt;
  const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), s = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  camera.position.addScaledVector(f, ileri * hiz).addScaledVector(s, yan * hiz);
  // shortcut: duvar çarpışması yok, yalnızca stand çevresinde sınırlı alan
  camera.position.x = THREE.MathUtils.clamp(camera.position.x, -3, 9);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z, -9, 6);
  camera.position.y = 1.6;
  camera.rotation.set(pitch, yaw, 0);
}

function boyut() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 70 : 55;  // dikey telefonda daha geniş açı
  camera.updateProjectionMatrix();
}
addEventListener("resize", boyut); boyut();

const durum = document.getElementById("durum"), dYazi = document.getElementById("durum-yazi"), dBar = document.getElementById("durum-bar");
// çözücü sayfanın yanında (CDN'den indirme engelli)
const draco = new DRACOLoader().setDecoderPath("draco/").setDecoderConfig({ type: "wasm" });
new GLTFLoader().setDRACOLoader(draco).load("stand.json", (gltf) => {
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    for (const m of [].concat(o.material)) {
      // duvar çizimleri: alfa testi ince çizgileri uzaktan siliyordu; yarı saydam karıştırma ile çiz, duvarla çakışmasın
      if (m.name && m.name.startsWith("Cizim")) {
        Object.assign(m, { transparent: true, alphaTest: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
        o.castShadow = false; o.renderOrder = 1;
      }
      // logo: spot yerine kendi turkuazından hafif ışıma, her yeri eşit görünsün
      if (m.name === "Maarif_Turkuaz") { m.emissive = m.color.clone(); m.emissiveIntensity = 0.18; m.roughness = 0.6; }
      if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    }
  });
  scene.add(gltf.scene);
  durum.hidden = true;
  git("genel");
}, (e) => {
  // sunucu dosyayı sıkıştırınca loaded > total olabiliyor: %99'da tut
  if (e.lengthComputable) { const p = Math.min(99, Math.round((e.loaded / e.total) * 100)); dBar.style.width = p + "%"; dYazi.textContent = `Stand yükleniyor… %${p}`; }
}, (err) => {
  dYazi.textContent = "Model yüklenemedi. Sayfayı yenileyip tekrar deneyin.";
  console.error(err);
});

const saat = new THREE.Clock();
git("genel");
renderer.setAnimationLoop(() => {
  const dt = Math.min(saat.getDelta(), 0.05);
  if (mod === "gez") yuru(dt); else orbit.update();
  renderer.render(scene, camera);
});
</script>

</html>
